name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Order is binding: lint, typecheck, boundaries, test. All must pass.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:boundaries
      - run: pnpm test
