name: MOD-006 T01 Posted Journal Reclassification RED

on:
  push:
    branches:
      - test/mod006-journal-account-retype-166-20261114
  pull_request:
    branches:
      - chore/hisabiq-adoption-runtime-a01

jobs:
  posted-journal-history:
    name: T01 signed posted-journal reclassification PostgreSQL16 acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mod006_166_ci_only
          POSTGRES_DB: hisabiq_mod006_journal_retype_166_20261114
        ports:
          - 55816:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hisabiq_mod006_journal_retype_166_20261114"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MOD006_166_JOURNAL_RETYPE_TEST_ONLY: MOD006_166_DISPOSABLE_JOURNAL_RETYPE_ONLY_20261114
      DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55816/hisabiq_mod006_journal_retype_166_20261114
      TEST_DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55816/hisabiq_mod006_journal_retype_166_20261114
      ADMIN_DATABASE_URL: postgres://postgres:mod006_166_ci_only@127.0.0.1:55816/hisabiq_mod006_journal_retype_166_20261114
      NODE_ENV: test
      JWT_SECRET: test-secret-not-used-in-production
      ENTITLEMENT_SOURCE: subscription
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install lockfile
        run: pnpm install --frozen-lockfile
      - name: Build API dependencies
        run: pnpm --filter '@sher/api...' build
      - name: Test authentic Nest API journal classification invariants
        run: pnpm --filter @sher/api exec vitest run test/hisabiq-mod006-journal-retype-history-166.spec.ts --reporter=verbose
