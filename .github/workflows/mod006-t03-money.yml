name: MOD-006 T03 Money Rules

on:
  push:
    branches:
      - fix/mod006-t03-lender-principal-20261113
  pull_request:
    branches:
      - fix/mod006-t05-counted-close-20261113

jobs:
  money-rules:
    name: T03 lender and owner journal rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mod006_t03_rules_ci_only
          POSTGRES_DB: hisabiq_mod006_t03_rules_20261113
        ports:
          - 55731:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hisabiq_mod006_t03_rules_20261113"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MOD006_T03_RULES_TEST_ONLY: MOD006_T03_RULES_DISPOSABLE_ONLY_20261113
      DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55731/hisabiq_mod006_t03_rules_20261113
      TEST_DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55731/hisabiq_mod006_t03_rules_20261113
      ADMIN_DATABASE_URL: postgres://postgres:mod006_t03_rules_ci_only@127.0.0.1:55731/hisabiq_mod006_t03_rules_20261113
      NODE_ENV: test
      JWT_SECRET: test-secret-not-used-in-production
      ENTITLEMENT_SOURCE: subscription

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@sher/api..." build
      - name: Isolated T03 signed Nest and lender cash accounting acceptance
        run: pnpm --filter @sher/api exec vitest run test/hisabiq-mod006-t03-money-rules.spec.ts --reporter=verbose
