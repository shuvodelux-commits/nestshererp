name: MOD-006 T04 Account Metadata TOCTOU

on:
  push:
    branches:
      - test/mod006-t04-account-metadata-toctou-20261114
  pull_request:
    branches:
      - chore/hisabiq-adoption-runtime-a01

jobs:
  account-type-toctou:
    name: T04 signed account-type TOCTOU acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mod006_t04_toctou_ci_only
          POSTGRES_DB: hisabiq_mod006_t04_toctou_20261114
        ports:
          - 55763:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hisabiq_mod006_t04_toctou_20261114"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MOD006_T04_ACCOUNT_TOCTOU_TEST_ONLY: MOD006_T04_ACCOUNT_TOCTOU_DISPOSABLE_ONLY_20261114
      DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55763/hisabiq_mod006_t04_toctou_20261114
      TEST_DATABASE_URL: postgres://sher_app:sher_app_test@127.0.0.1:55763/hisabiq_mod006_t04_toctou_20261114
      ADMIN_DATABASE_URL: postgres://postgres:mod006_t04_toctou_ci_only@127.0.0.1:55763/hisabiq_mod006_t04_toctou_20261114
      NODE_ENV: test
      JWT_SECRET: test-secret-not-used-in-production
      ENTITLEMENT_SOURCE: subscription

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@sher/api..." build
      - name: Real authenticated Nest/PostgreSQL16 race (RED-first)
        run: pnpm --filter @sher/api exec vitest run test/hisabiq-mod006-t04-account-metadata-toctou.spec.ts --reporter=verbose
